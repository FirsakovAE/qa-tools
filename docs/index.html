<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Vue Inspector has moved</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://vue-inspector.pages.dev/">
  <script>
    (function () {
      var path = location.pathname.replace(/^\/qa-tools(?=\/|$)/, '') || '/';
      location.replace('https://vue-inspector.pages.dev' + path + location.search + location.hash);
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=https://vue-inspector.pages.dev/">
</head>
<body>
  <p>Vue Inspector has moved to <a href="https://vue-inspector.pages.dev/">https://vue-inspector.pages.dev</a>.</p>
</body>
</html>
